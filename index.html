<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
 
  <title>Sticky Notes</title>
  
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <div class="dashboard">
    
    <h1 class="heading">Sticky Notes</h1>

    
    <div id="notes-container" class="notes-grid">
      
      <div class="note-card input-card">

        <textarea id="note-input" placeholder="Try a new note...."></textarea>
        
        <button id="add-btn" class="add-btn">+</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
